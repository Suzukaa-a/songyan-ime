name: Release

# Pushing a tag vX.Y.Z (or vX.Y.Z-suffix for a pre-release) on a commit of
# main runs CI (lint, tests, Debug device build), then publishes a GitHub
# Release with an ad-hoc signed IPA for re-signing installers (AltStore,
# Sideloadly).
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

env:
  # Same Xcode as ci.yml.
  DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish
    needs: checks
    runs-on: xcode-27
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The build number counts commits, and the main check needs its history.
          fetch-depth: 0
      - name: Read version from tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          [[ "${TAG}" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.]+)?$ ]] \
            || { echo "::error::tag ${TAG} is not vX.Y.Z or vX.Y.Z-suffix"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main \
            || { echo "::error::tag ${TAG} is not on main"; exit 1; }
          {
            echo "marketing=${BASH_REMATCH[1]}"
            echo "full=${TAG#v}"
            echo "build=$(git rev-list --count HEAD)"
            echo "prerelease=$([[ -n "${BASH_REMATCH[2]}" ]] && echo true || echo false)"
          } >>"${GITHUB_OUTPUT}"
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Build Release device app
        env:
          APP_VERSION: ${{ steps.version.outputs.marketing }}
          APP_BUILD: ${{ steps.version.outputs.build }}
        run: Tools/CI/scripts/build-app.sh Release device
      - name: Package IPA
        run: Tools/CI/scripts/package-ipa.sh "dist/Songyan-${{ steps.version.outputs.full }}.ipa"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.full }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "松烟 ${VERSION}")
          [[ "${PRERELEASE}" != true ]] || flags+=(--prerelease)
          gh release create "${TAG}" dist/*.ipa "${flags[@]}"
      - name: Upload failed build logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-build-logs
          path: .local/ci/app-Release-device/**/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
