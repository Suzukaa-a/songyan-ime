schema:
  schema_id: songyan_quanpin
  name: Grammar ranking fixture
  version: "1"
engine:
  processors: [speller, selector, navigator, express_editor]
  segmentors: [abc_segmentor, fallback_segmentor]
  translators: [script_translator]
  filters: [uniquifier]
speller:
  alphabet: abcdefghijklmnopqrstuvwxyz
  delimiter: " '"
  algebra: []
translator:
  dictionary: songyan_basic
  prism: songyan_quanpin
  enable_user_dict: false
  enable_completion: false
  max_homophones: 8
  contextual_suggestions: false
