[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [
  ".build",
  ".local",
  ".worktrees",
  "DerivedData",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
# Long embedded Swift snippets and command lines read better unwrapped; ruff leaves E501 out by default too.
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
