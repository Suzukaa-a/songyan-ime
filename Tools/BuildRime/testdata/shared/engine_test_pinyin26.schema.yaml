# Engine self-test schema A — plain 26-key full pinyin.
# Synthetic fixture; see testdata/shared/README.md.
schema:
  schema_id: engine_test_pinyin26
  name: 引擎自测·26键全拼
  version: "0.1.0"
  description: |
    Engine mechanism self-test (schema A).
    Types full pinyin straight against engine_test_dict.
    No abbreviations, no fuzzy readings.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]

ascii_composer:
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra: []

translator:
  dictionary: engine_test_dict
  prism: engine_test_pinyin26
  user_dict: engine_test_dict
  db_class: userdb
  enable_user_dict: true
  enable_sentence: false
  enable_completion: false

menu:
  page_size: 5
