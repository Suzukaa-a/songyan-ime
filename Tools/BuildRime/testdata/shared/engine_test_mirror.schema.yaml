# Engine self-test schema B — "mirror keyboard" over the SAME dictionary.
# Synthetic fixture; see testdata/shared/README.md.
#
# B transforms every physical key into a different pinyin letter
# (a<->z, b<->y, ..., i.e. `xlit/abcdefghijklmnopqrstuvwxyz/zyxwvutsrqponmlkjihgfedcba/`),
# then segments exactly like schema A. It therefore needs its own prism, while
# sharing `engine_test_dict` (dictionary AND user dictionary) with schema A.
#
# To type pinyin `s e n l i n` on B you press the mirrored keys
# `h v m o r m` (the transformation is an involution).
schema:
  schema_id: engine_test_mirror
  name: 引擎自测·镜像键
  version: "0.1.0"
  description: |
    Engine mechanism self-test (schema B): same dictionary and user_dict as
    engine_test_pinyin26, distinct speller algebra and prism.

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]

ascii_composer:
  switch_key:
    Shift_L: inline_ascii
    Shift_R: commit_text

engine:
  processors:
    - ascii_composer
    - speller
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - fallback_segmentor
  translators:
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    - xlit/abcdefghijklmnopqrstuvwxyz/zyxwvutsrqponmlkjihgfedcba/

translator:
  dictionary: engine_test_dict
  prism: engine_test_mirror
  user_dict: engine_test_dict
  db_class: userdb
  enable_user_dict: true
  enable_sentence: false
  enable_completion: false

menu:
  page_size: 5
